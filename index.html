<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gift 2026 Event Finance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>Gift 2026 Event Finance Dashboard</h1>
      </header>

      <div id="status" class="status" hidden></div>

      <section class="kpi-grid" aria-label="สรุปยอด">
        <article class="kpi-block">
          <h2 class="kpi-label">รายรับ</h2>
          <div class="kpi-card kpi-income">
            <p class="kpi-caption">Total Income</p>
            <p id="kpi-income" class="kpi-value">—</p>
          </div>
        </article>
        <article class="kpi-block">
          <h2 class="kpi-label">รายจ่าย</h2>
          <div class="kpi-card kpi-expense">
            <p class="kpi-caption">Total Expense</p>
            <p id="kpi-expense" class="kpi-value">—</p>
          </div>
        </article>
        <article class="kpi-block">
          <h2 class="kpi-label">คงเหลือ</h2>
          <div class="kpi-card kpi-balance">
            <p class="kpi-caption">Current Balance</p>
            <p id="kpi-balance" class="kpi-value">—</p>
          </div>
        </article>
      </section>

      <section class="chart-grid" aria-label="กราฟสรุป">
        <article class="chart-card">
          <h2>รายรับแยกประเภท</h2>
          <div id="income-legend" class="legend"></div>
          <div class="chart-stage">
            <canvas id="income-chart" role="img" aria-labelledby="income-sr-title"></canvas>
            <div id="income-tooltip" class="chart-tooltip" hidden></div>
          </div>
          <table id="income-sr-table" class="sr-only">
            <caption id="income-sr-title">รายรับแยกประเภท</caption>
            <thead>
              <tr>
                <th scope="col">หมวด</th>
                <th scope="col">จำนวน</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </article>

        <article class="chart-card">
          <h2>รายจ่ายแยกตามทีม</h2>
          <div id="expense-legend" class="legend"></div>
          <div class="chart-stage">
            <canvas id="expense-chart" role="img" aria-labelledby="expense-sr-title"></canvas>
            <div id="expense-tooltip" class="chart-tooltip" hidden></div>
          </div>
          <table id="expense-sr-table" class="sr-only">
            <caption id="expense-sr-title">รายจ่ายแยกตามทีม</caption>
            <thead>
              <tr>
                <th scope="col">ทีม</th>
                <th scope="col">จำนวน</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </article>
      </section>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
